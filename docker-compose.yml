version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server 
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
  vite_dev:
    build:
      context: .
      target: frontend_dev
    ports:
      - "5173:5173"
    environment:
      - DOCKER=true
  server_dev:
    build:
      context: .
      target: server_dev
    ports:
      - "9292:9292"
    environment:
      - REDIS_URL=redis://@redis:6379/1
      - RACK_ENV=development
volumes:
  redis_data: